name: Tests

on:
  pull_request:
  push:
    paths:
      - collector.py
      - sources.json
      - requirements.txt
      - tests/**
      - .github/workflows/test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
